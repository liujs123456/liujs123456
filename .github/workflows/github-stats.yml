name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-stats:
    name: Generate stats images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: jstrieb/github-stats@master
        with:
          ACCESS_TOKEN: ${{ secrets.STATS_TOKEN }}
